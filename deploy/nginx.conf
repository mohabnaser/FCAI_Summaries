# Sample nginx site for the FCAI Summaries SPA.
#
# The deployment workflow copies the contents of the local dist/ directory to
# the web root below, so this directory always contains index.html and assets/.
# Keep the try_files fallback: BrowserRouter uses real path URLs and a refresh
# on a deep link must load the SPA shell instead of returning nginx's 404.

server {
    listen 80;
    server_name _;

    root /var/www/FCAI_Summaries/prod;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; missing ones should stay a hard 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
